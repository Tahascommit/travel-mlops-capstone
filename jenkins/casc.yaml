# Jenkins configuration as code: admin user, security and the pipeline job.
# Loaded on every start, so the setup is the same each time the container is recreated.
jenkins:
  systemMessage: "Travel MLOps - CI/CD for the flight price API"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: admin
          password: ${JENKINS_ADMIN_PASSWORD}
        # used by the airflow dag to start a deployment, so builds show "Started by user airflow"
        - id: airflow
          name: airflow
          password: ${JENKINS_AIRFLOW_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: http://localhost:8081/

jobs:
  - script: |
      pipelineJob('flight-price-cicd') {
        description('Tests the code, packages the champion model from MLflow into the API image and deploys it to Kubernetes. Pipeline is defined in the Jenkinsfile in the repo.')
        // same parameter as in the Jenkinsfile. declared here too so the job is parameterized right
        // after jenkins starts, otherwise airflow's buildWithParameters call fails until the first build
        parameters {
          booleanParam('RETRAIN', false, 'Train a new model in this build instead of using the champion from MLflow')
        }
        properties {
          disableConcurrentBuilds()
          pipelineTriggers {
            triggers {
              // check github for new commits every 5 minutes
              pollSCM { scmpoll_spec('H/5 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
