# Autoscaling: add pods when average cpu goes above 50% of the request, up to 8 pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-price-api
  namespace: travel-mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-price-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
