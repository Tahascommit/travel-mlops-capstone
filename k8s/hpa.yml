# Autoscaling: add pods when average cpu goes above 50% of the request, up to 8 pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flight-price-api
  namespace: travel-mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flight-price-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      # react fast to load: pods can double every 15 seconds
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # scale down slowly so a short dip in traffic doesn't remove pods we need again a minute later
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
